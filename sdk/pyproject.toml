[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandora-audio8-asr-infinite"
dynamic = ["version"]
description = "Audio8-ASR-Infinite Python SDK with the matched Linux AArch64 native library"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0 AND LicenseRef-Pandora-Model-SDK"
license-files = ["python/LICENSE", "lib/LICENSE", "lib/LICENSE.zh-CN.txt", "lib/THIRD_PARTY_NOTICES.txt", "lib/LICENSES/*"]
dependencies = ["pandora-runtime>=1.0.2,<2", "numpy>=1.22", "scipy>=1.8", "soundfile>=0.12"]

[project.urls]
Repository = "https://github.com/APLUX-Pandora/audio8-asr-infinite-demo"

[tool.setuptools]
package-dir = {"" = "python"}
include-package-data = false

[tool.setuptools.dynamic]
version = {attr = "pandora_audio8_asr_infinite.__version__"}

[tool.setuptools.packages.find]
where = ["python"]
include = ["pandora_audio8_asr_infinite"]
